version: 2
# Every ecosystem waits seven days before proposing a new release:
# compromised or broken versions are usually caught and yanked within days.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Minor and patch releases of the other packages come together, in one
      # pull request a week. Kept apart, in pull requests of their own:
      # @playwright/test, whose update must also change the image of the
      # end-to-end job (ci.yml); maplibre-gl, whose download size is weighed
      # at each release (TESTS.md, November 2026); and every major release.
      minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["@playwright/test", "maplibre-gl"]
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint accepts TypeScript below 6.1 only (peer dependency
      # ">=4.8.4 <6.1.0" up to 8.71), so a TypeScript 7 update cannot install.
      # Remove this entry once a typescript-eslint release accepts TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: "/pipeline"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
