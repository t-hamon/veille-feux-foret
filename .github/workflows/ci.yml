name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# pip skips any release uploaded less than seven days ago, like npm with
# min-release-age in web/.npmrc. The setting needs pip 26.0 or later and older
# versions ignore it, so each job first installs a pinned pip.
env:
  PIP_UPLOADED_PRIOR_TO: P7D

# Runners are pinned to Ubuntu 24.04: ubuntu-latest moves to Ubuntu 26 from
# 19 October 2026, and a runner change should come in its own pull request.
jobs:
  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install pip==26.2.1
          python -m pip install --upgrade setuptools
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy src tests
      - name: Tests with coverage
        run: pytest
      - name: Bandit
        run: bandit -c pyproject.toml -r src
      - name: Dependency audit
        run: pip-audit --skip-editable
      - name: CI tools (lint, types, tests)
        working-directory: tools
        run: |
          ruff check . && ruff format --check .
          mypy --strict .
          python -m pytest -p no:cacheprovider .

  web:
    name: Web (lint, types, unit tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle size budget
        run: npm run size
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  e2e:
    name: End-to-end (Chromium, Firefox, WebKit)
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Official Playwright image, as documented by Playwright: the three browsers
    # and their system libraries are preinstalled. Installing them on the runner
    # took from under a minute to more than half an hour depending on the run.
    # The tag must match @playwright/test in web/package-lock.json (checked below);
    # the digest is the multi-platform index published for that tag.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check that the image matches the Playwright version
        env:
          IMAGE_VERSION: "1.63.0"
        run: |
          installed="$(node -p "require('@playwright/test/package.json').version")"
          if [ "$installed" != "$IMAGE_VERSION" ]; then
            echo "::error::@playwright/test is $installed but the container image is $IMAGE_VERSION; update the image tag in ci.yml"
            exit 1
          fi
      - run: npm run build
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      # Audit the page as it is once deployed, with data files: those written
      # by the pipeline from the capture of 3 October 2026 (e2e/fixtures). The
      # base map is loaded from its real server, like for any visitor.
      - name: Add the data files of the test capture
        run: cp -r e2e/fixtures/complet dist/data
      # Thresholds (web/lighthouserc.json): first contentful paint, largest
      # contentful paint, layout shift, accessibility and best practices fail
      # the job. The performance score and the total blocking time only warn:
      # they are dominated by drawing the WebGL map on a runner without GPU
      # and a 4x slowed CPU (3.6 to 4.9 s of blocking time measured on
      # 5 October 2026). Their values are published as annotations each run.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Report the results as annotations
        if: ${{ !cancelled() }}
        run: python3 ../tools/ci_annotations.py lighthouse .lighthouseci
