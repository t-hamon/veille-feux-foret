name: Deploy trigger

# Deploys the Worker of web/trigger, which starts the Deploy workflow every
# 30 minutes through the GitHub API (GitHub delays or drops most runs of the
# schedule event). It runs when the Worker or this file changes on main, and by
# hand from the Actions tab.
#
# The Worker's own secret, GITHUB_TOKEN, is set once in the Cloudflare
# dashboard and kept by every deployment: it never passes through GitHub.
on:
  push:
    branches: [main]
    paths:
      - "web/trigger/**"
      - ".github/workflows/trigger.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: trigger
  cancel-in-progress: false

# Runners are pinned to Ubuntu 24.04: ubuntu-latest moves to Ubuntu 26 from
# 19 October 2026, and a runner change should come in its own pull request.
jobs:
  deploy:
    name: Deploy the trigger Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Same environment as the site: its Cloudflare secrets only exist there,
    # and it only accepts deployments from main.
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install wrangler without running any install script
        # Same check as in deploy.yml: npm carries on when an optional dependency
        # fails to install, and the install script of workerd is not run here,
        # so the binary of workerd is checked and the install tried again.
        run: |
          for attempt in 1 2 3; do
            if npm ci --ignore-scripts && [ -f node_modules/@cloudflare/workerd-linux-64/package.json ]; then
              exit 0
            fi
            echo "::warning title=Install::attempt $attempt of 3 failed or left out @cloudflare/workerd-linux-64"
            sleep 10
          done
          echo "::error title=Install::wrangler could not be installed in 3 attempts"
          exit 1
      - name: Deploy the Worker and its schedule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Same retries as in deploy.yml, where the Cloudflare API failed for a
        # while on 12 and 17 October 2026, then worked again with the same
        # token: deploying the same Worker again gives the same Worker.
        run: |
          for attempt in 1 2 3; do
            if npx wrangler deploy --config trigger/wrangler.jsonc; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning title=Deploy::attempt $attempt of 3 failed, next attempt in 30 s"
              sleep 30
            fi
          done
          echo "::error title=Deploy::deployment failed 3 times"
          exit 1
