name: Deploy

# Builds the data from the public sources and the site, deploys both to
# Cloudflare Workers, then checks the deployed site. It is started every 30
# minutes by the trigger Worker (web/trigger, through workflow_dispatch), on
# each push to main, and by hand from the Actions tab. Its own schedule below
# is a fallback: GitHub delays or drops most scheduled runs.
#
# The previous data files are read back from the deployed site itself: when a
# source does not answer, the build keeps its last data and says so, instead of
# emptying the map (see pipeline/src/veille_feux/build.py).
#
# Two jobs, so that the Cloudflare token never shares a machine with the build
# tools: the build job runs the pipeline and the npm toolchain without any
# secret; the deploy job installs dependencies without running their install
# scripts, and only runs wrangler and the deployment check.
on:
  schedule:
    # Minutes 7 and 37 rather than 0 and 30: GitHub delays scheduled runs most
    # at the top of the hour.
    - cron: "7,37 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deployment at a time. A run that starts while another is in progress
# waits; if several pile up, GitHub keeps only the latest waiting one.
concurrency:
  group: deploy
  cancel-in-progress: false

# pip skips any release uploaded less than seven days ago, like npm with
# min-release-age in web/.npmrc. The setting needs pip 26.0 or later and older
# versions ignore it, so the job first installs a pinned pip.
env:
  PIP_UPLOADED_PRIOR_TO: P7D
  # Same address in the deployed-site scan of security.yml.
  SITE_URL: "https://veille-feux-foret.hamonthibaud.workers.dev"

# Runners are pinned to Ubuntu 24.04: ubuntu-latest moves to Ubuntu 26 from
# 19 October 2026, and a runner change should come in its own pull request.
jobs:
  build:
    name: Build the data and the site
    runs-on: ubuntu-24.04
    # The sources are given about 11 minutes at most (build.py timeouts).
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the pipeline
        run: |
          python -m pip install pip==26.2.1
          python -m pip install ./pipeline
      - name: Read the data files of the deployed site
        run: |
          mkdir -p previous
          for name in etat.json detections.geojson foyers.geojson foyers-emprises.geojson surfaces-brulees.geojson bilan.json vent.json meteo-foyers.json; do
            if ! curl --fail --silent --show-error --proto '=https' --max-time 60 \
                 --max-filesize 62914560 --output "previous/$name" "$SITE_URL/data/$name"; then
              rm -f "previous/$name"
              echo "::notice title=Previous data::$name could not be read from the deployed site"
            fi
          done
      - name: Build the data
        run: veille-feux-build data --previous previous
      - name: Report the state of each source
        if: ${{ !cancelled() }}
        run: python3 tools/ci_annotations.py status data/etat.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site
        working-directory: web
        run: |
          npm ci
          npm run build
          cp -r ../data dist/data
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy and check
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The Cloudflare secrets only exist in this environment, which only accepts
    # deployments from main (Settings > Environments).
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install wrangler without running any install script
        working-directory: web
        # npm carries on when an optional dependency fails to install, and the
        # install script of workerd that would fetch its binary is not run here:
        # on 20 October 2026, npm ci ended without @cloudflare/workerd-linux-64
        # (238 packages instead of 239) and wrangler stopped at once. The
        # install is checked and tried again, three times at most.
        run: |
          for attempt in 1 2 3; do
            if npm ci --ignore-scripts && [ -f node_modules/@cloudflare/workerd-linux-64/package.json ]; then
              exit 0
            fi
            echo "::warning title=Install::attempt $attempt of 3 failed or left out @cloudflare/workerd-linux-64"
            sleep 10
          done
          echo "::error title=Install::wrangler could not be installed in 3 attempts"
          exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: web/dist
      - name: Deploy to Cloudflare Workers
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The Cloudflare API failed twice for a while with no change on our
        # side: on 12 October 2026 it answered the list of deployments with a
        # body wrangler could not read, on 17 October it refused the upload of
        # the files (401 Unauthorized, five times in a row); both times the run
        # 30 minutes later succeeded with the same token. Deploying the same
        # files twice gives the same site, so the deployment is tried again,
        # three times at most, 30 seconds apart.
        run: |
          for attempt in 1 2 3; do
            if npx wrangler deploy; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning title=Deploy::attempt $attempt of 3 failed, next attempt in 30 s"
              sleep 30
            fi
          done
          echo "::error title=Deploy::deployment failed 3 times"
          exit 1
      - name: Check the deployed site
        run: python3 tools/check_deployment.py "$SITE_URL" web/dist/data/etat.json
