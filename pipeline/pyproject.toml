[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "veille-feux"
version = "0.1.0"
description = "Data pipeline for veille-feux-foret: fetches and normalises public fire data sources."
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.scripts]
veille-feux-capture = "veille_feux.capture:main"
veille-feux-build = "veille_feux.build:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veille_feux = ["data/*.json", "data/*.geojson"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=veille_feux --cov-report=term-missing --cov-report=xml"

[tool.bandit]
exclude_dirs = ["tests"]
